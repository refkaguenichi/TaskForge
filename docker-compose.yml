version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskforge-backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-taskforge}
      DB_USER: ${DB_USER:-taskforge}
      DB_PASSWORD: ${DB_PASSWORD:-taskforge_pass}
      REDIS_HOST: redis-taskforge
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_URL: redis://redis-taskforge:6379/${REDIS_DB:-0}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - mysql
      - redis-taskforge
      - rabbitmq
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  mysql:
    image: mysql:8.0
    container_name: taskforge-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-taskforge}
      MYSQL_USER: ${DB_USER:-taskforge}
      MYSQL_PASSWORD: ${DB_PASSWORD:-taskforge_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: taskforge-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    ports:
      - "8080:80"
    depends_on:
      - mysql

  mongo-taskforge:
    image: mongo:7
    container_name: taskforge-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpass}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-taskforge}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: taskforge-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo-taskforge
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-adminpass}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-adminpass}
    ports:
      - "8082:8081"
    depends_on:
      - mongo-taskforge

  redis-taskforge:
    image: redis:7-alpine
    container_name: taskforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-commander-taskforge:
    image: rediscommander/redis-commander:latest
    container_name: taskforge-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis-taskforge:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis-taskforge

  rabbitmq:
    image: rabbitmq:3-management
    container_name: taskforge-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mysql_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
