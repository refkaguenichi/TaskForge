stages:
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  IMAGE_TAG: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  IMAGE_TAG_LATEST: $CI_REGISTRY_IMAGE/backend:latest

build_backend_image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --pull -f backend/Dockerfile -t "$IMAGE_TAG" -t "$IMAGE_TAG_LATEST" backend
    - docker push "$IMAGE_TAG"
    - docker push "$IMAGE_TAG_LATEST"
  rules:
    - if: $CI_COMMIT_BRANCH
